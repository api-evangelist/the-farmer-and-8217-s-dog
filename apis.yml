description: 'The Farmer&#8217;s Dog is a New York-based direct-to-consumer pet health
  company that makes fresh, human-grade dog food. Founded in 2014 by Brett Podolsky
  and Jonathan Regev, it builds personalized meal plans from each dog''s profile and
  delivers pre-portioned, gently cooked meals on a recurring subscription, shipping
  nationwide across the United States from its own food-safety-standard kitchens. The
  company is a consumer-brand portfolio company of Insight Partners. It operates a
  public marketing/commerce website and a GitHub organization (github.com/farmersdog)
  of internal tooling, but does not publish a public developer API; this profile was
  surfaced as a portfolio lead and enriched with the honest finding that there is no
  public API surface.'
